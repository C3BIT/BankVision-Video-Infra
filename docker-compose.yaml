services:
  livekit:
    image: livekit/livekit-server:v1.8.2
    command: run
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50050:50000-50050/udp"
    environment:
      - |
        LIVEKIT_CONFIG=
        port: 7880
        rtc:
          port_range_start: 50000
          port_range_end: 50050
          tcp_port: 7881
          node_ip: 124.109.105.65
          use_external_ip: true
        redis:
          address: redis:6379
          password: ${REDIS_PASSWORD}
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - bankvision-net

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - bankvision-net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    restart: unless-stopped
    command: server /data --console-address ":9001" --address ":9000"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - ./data/minio:/data
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - bankvision-net

  egress:
    image: livekit/egress:v1.8.6
    restart: unless-stopped
    privileged: true
    shm_size: '1gb'
    network_mode: host
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /tmp/egress
        cat <<EOFCONFIG > /tmp/egress/egress.yaml
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://127.0.0.1:7880
        redis:
          address: 127.0.0.1:6379
          password: ${REDIS_PASSWORD}
        s3:
          access_key: ${MINIO_ROOT_USER}
          secret: ${MINIO_ROOT_PASSWORD}
          region: us-east-1
          endpoint: http://127.0.0.1:9000
          bucket: ${MINIO_BUCKET}
          force_path_style: true
        EOFCONFIG
        export EGRESS_CONFIG_FILE=/tmp/egress/egress.yaml
        exec /entrypoint.sh
    depends_on:
      - livekit
      - minio
    deploy:
      resources:
        limits:
          memory: 1512M

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do
          echo 'Waiting for MinIO...'; sleep 2
        done
        mc mb --ignore-existing local/${MINIO_BUCKET}
        echo 'Bucket ready.'
    networks:
      - bankvision-net

networks:
  bankvision-net:
    driver: bridge
