services:
  livekit:
    image: livekit/livekit-server:v1.8.2
    command: run --config /etc/livekit.yaml
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50020:50000-50020/udp"
    volumes:
      - ./config/livekit.yaml:/etc/livekit.yaml
    networks:
      - mtb-network

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-VbrmRedis2024Secure}
    volumes:
      - redis_data:/data
    networks:
      - mtb-network

networks:
  mtb-network:
    external: true
    name: mtb-network

volumes:
  redis_data:
