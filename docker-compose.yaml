services:
  livekit:
    image: livekit/livekit-server:v1.8.2
    # LiveKit is confirmed stable with this multi-line config injection
    command: run
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50050:50000-50050/udp"
    environment:
      - |
        LIVEKIT_CONFIG=
        port: 7880
        rtc:
          port_range_start: 50000
          port_range_end: 50050
          tcp_port: 7881
          use_external_ip: true
        redis:
          address: vbrm-redis:6379
          password: VbrmRedis2024Secure
        keys:
          vbrm_openvidu_key: vbrm_openvidu_secret_2024_secure_key
    labels:
      - "coolify.managed=true"
      - "traefik.http.services.livekit.loadbalancer.server.port=7880"
      - "traefik.http.routers.livekit.service=livekit"
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - mtb-network

  vbrm-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-VbrmRedis2024Secure}
    volumes:
      - ./data/redis:/data
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - mtb-network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    restart: unless-stopped
    command: server /data --console-address ":9001" --address ":9000"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-vbrm_password_2024}
    volumes:
      - ./data/minio:/data
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - mtb-network

  egress:
    image: livekit/egress:v1.8.6
    restart: unless-stopped
    privileged: true
    shm_size: '1gb'
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /tmp/egress
        cat <<EOFCONFIG > /tmp/egress/egress.yaml
        api_key: vbrm_openvidu_key
        api_secret: vbrm_openvidu_secret_2024_secure_key
        ws_url: ws://livekit:7880
        redis:
          address: vbrm-redis:6379
          password: VbrmRedis2024Secure
        s3:
          access_key: ${MINIO_ROOT_USER}
          secret: ${MINIO_ROOT_PASSWORD}
          region: us-east-1
          endpoint: http://minio:9000
          bucket: bankvision-mtb-ext
          force_path_style: true
        EOFCONFIG
        export EGRESS_CONFIG_FILE=/tmp/egress/egress.yaml
        exec /entrypoint.sh
    deploy:
      resources:
        limits:
          memory: 1512M
    networks:
      - mtb-network

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do
          echo 'Waiting for MinIO...'; sleep 2
        done
        mc mb --ignore-existing local/bankvision-mtb-ext
        echo 'Bucket ready.'
    networks:
      - mtb-network

networks:
  mtb-network:
    external: true
    name: mtb-network
