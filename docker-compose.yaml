services:
  livekit:
    image: livekit/livekit-server:v1.8.2
    command: run --config /etc/livekit.yaml
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50020:50000-50020/udp"
    volumes:
      - ./config/livekit.yaml:/etc/livekit.yaml
    networks:
      - mtb-network

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-VbrmRedis2024Secure}
    volumes:
      - redis_data:/data
    networks:
      - mtb-network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    restart: unless-stopped
    command: server /data --console-address ":9001" --address ":9000"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-vbrm_password_2024}
    volumes:
      - minio_data:/data
    # NO host ports mapped to avoid conflict with existing server MinIO.
    # Access via Coolify domain or internal network name 'minio'.
    networks:
      - mtb-network

  egress:
    image: livekit/egress:v1.8.6
    restart: unless-stopped
    environment:
      - EGRESS_CONFIG_FILE=/etc/egress.yaml
      - LIVEKIT_REDIS_ADDRESS=redis:6379
      - LIVEKIT_REDIS_PASSWORD=VbrmRedis2024Secure
      - LIVEKIT_URL=ws://livekit:7880
    volumes:
      - ./config/egress.yaml:/etc/egress.yaml
    networks:
      - mtb-network

#   ingress:
#     image: livekit/ingress:v1.4.3
#     restart: unless-stopped
#     ports:
#       - "1936:1935" # RTMP
#       - "7886:7885/udp" # WHIP
#     environment:
#       - INGRESS_CONFIG_FILE=/etc/ingress.yaml
#       - LIVEKIT_REDIS_ADDRESS=redis:6379
#       - LIVEKIT_REDIS_PASSWORD=VbrmRedis2024Secure
#       - LIVEKIT_URL=ws://livekit:7880
#     volumes:
#       - ./config/ingress.yaml:/etc/ingress.yaml
#     networks:
#       - mtb-network

networks:
  mtb-network:
    external: true
    name: mtb-network

volumes:
  redis_data:
  minio_data:
