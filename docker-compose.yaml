services:
  nginx:
    image: nginx:1.29.7-alpine
    container_name: bankvision-livekit-nginx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/ssl/bankvision:/etc/ssl/bankvision:ro

  livekit:
    image: livekit/livekit-server:v1.10.1
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50050:50000-50050/udp"
    volumes:
      - /etc/ssl/bankvision:/etc/ssl/bankvision:ro
      - ./livekit.yaml:/etc/livekit.yaml:ro
    command: --config /etc/livekit.yaml
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - bankvision-net

  redis:
    image: redis:7.4.8-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/redis:/data
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - bankvision-net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    restart: unless-stopped
    command: server /data --console-address ":9001" --address ":9000"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - ./data/minio:/data
    deploy:
      resources:
        limits:
          memory: 512M

  egress:
    image: livekit/egress:v1.8.6
    restart: unless-stopped
    privileged: true
    shm_size: '1gb'
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /tmp/egress
        cat <<EOFCONFIG > /tmp/egress/egress.yaml
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://127.0.0.1:7880
        redis:
          address: 127.0.0.1:6379
          password: ${REDIS_PASSWORD}
        s3:
          access_key: ${MINIO_ROOT_USER}
          secret: ${MINIO_ROOT_PASSWORD}
          region: us-east-1
          endpoint: http://127.0.0.1:9000
          bucket: ${MINIO_BUCKET}
          force_path_style: true
        EOFCONFIG
        export EGRESS_CONFIG_FILE=/tmp/egress/egress.yaml
        exec /entrypoint.sh
    network_mode: host
    depends_on:
      - redis
      - minio
    deploy:
      resources:
        limits:
          memory: 1512M

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        sleep 10
        retries=0
        until mc alias set local http://127.0.0.1:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} 2>/dev/null; do
          retries=$((retries+1))
          if [ $retries -ge 30 ]; then
            echo 'MinIO not ready after 60s, giving up.'
            exit 1
          fi
          echo "Waiting for MinIO... ($retries/30)"
          sleep 2
        done
        mc mb --ignore-existing local/${MINIO_BUCKET}
        mc anonymous set download local/${MINIO_BUCKET}
        echo 'Bucket ready with public read access.'
    network_mode: host

networks:
  bankvision-net:
    driver: bridge
