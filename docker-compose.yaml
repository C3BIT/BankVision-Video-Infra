services:
  livekit:
    image: livekit/livekit-server:v1.8.2
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50020:50000-50020/udp"
    volumes:
      - ./config/livekit.yaml:/etc/livekit.yaml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7880/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - mtb-network

  egress:
    image: livekit/egress:v1.8.6
    restart: unless-stopped
    environment:
      - EGRESS_CONFIG_FILE=/etc/egress.yaml
      - LIVEKIT_REDIS_ADDRESS=redis:6379
      - LIVEKIT_REDIS_PASSWORD=VbrmRedis2024Secure
      - LIVEKIT_URL=ws://livekit:7880
    volumes:
      - ./config/egress.yaml:/etc/egress.yaml
    depends_on:
      livekit:
        condition: service_healthy
    networks:
      - mtb-network

  ingress:
    image: livekit/ingress:v1.4.3
    restart: unless-stopped
    ports:
      - "1935:1935" # RTMP
      - "7885:7885/udp" # WHIP
    environment:
      - INGRESS_CONFIG_FILE=/etc/ingress.yaml
      - LIVEKIT_REDIS_ADDRESS=redis:6379
      - LIVEKIT_REDIS_PASSWORD=VbrmRedis2024Secure
      - LIVEKIT_URL=ws://livekit:7880
    volumes:
      - ./config/ingress.yaml:/etc/ingress.yaml
    depends_on:
      livekit:
        condition: service_healthy
    networks:
      - mtb-network

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001" --address ":9000"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - mtb-network

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - mtb-network

networks:
  mtb-network:
    external: true
    name: mtb-network

volumes:
  redis_data:
  minio_data:
