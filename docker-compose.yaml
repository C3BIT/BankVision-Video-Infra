services:
  livekit:
    image: livekit/livekit-server:v1.8.2
    # LiveKit is confirmed stable with this multi-line config injection
    command: run
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50050:50000-50050/udp"
    environment:
      - |
        LIVEKIT_CONFIG=
        port: 7880
        rtc:
          port_range_start: 50000
          port_range_end: 50050
          tcp_port: 7881
          use_external_ip: true
        redis:
          address: vbrm-redis:6379
          password: VbrmRedis2024Secure
        keys:
          vbrm_openvidu_key: vbrm_openvidu_secret_2024_secure_key
    labels:
      - "coolify.managed=true"
      - "traefik.http.services.livekit.loadbalancer.server.port=7880"
      - "traefik.http.routers.livekit.service=livekit"
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - mtb-network

  vbrm-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-VbrmRedis2024Secure}
    volumes:
      - ./data/redis:/data
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - mtb-network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    restart: unless-stopped
    command: server /data --console-address ":9001" --address ":9000"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-vbrm_password_2024}
    volumes:
      - ./data/minio:/data
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - mtb-network

  egress:
    image: livekit/egress:v1.8.6
    restart: unless-stopped
    # ULTIMATE HACK: Create the config file internally to bypass Coolify volume issues
    shm_size: '1gb'
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /tmp/egress
        cat <<EOF > /tmp/egress/egress.yaml
        api_key: vbrm_openvidu_key
        api_secret: vbrm_openvidu_secret_2024_secure_key
        ws_url: ws://livekit:7880
        redis:
          address: vbrm-redis:6379
          password: VbrmRedis2024Secure
        s3:
          access_key: IJE1GG708IQ2LEH7I2AS
          secret: PV7b+H48T5k0lSMnkjnu+tYdZTnBzwdiQCEo7mBj
          region: us-east-1
          endpoint: http://minio:9000
          bucket: bankvision-mtb-ext
          force_path_style: true
        EOF
        exec /tini -- egress --config /tmp/egress/egress.yaml
    deploy:
      resources:
        limits:
          memory: 1512M
    networks:
      - mtb-network

networks:
  mtb-network:
    external: true
    name: mtb-network
