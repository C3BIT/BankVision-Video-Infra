services:
  livekit:
    image: livekit/livekit-server:v1.8.2
    # Simple command using environment variables for keys
    command: run
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50010:50000-50010/udp"
    environment:
      # LiveKit can take keys via LIVEKIT_KEYS environment variable (YAML format)
      - LIVEKIT_KEYS=vbrm_openvidu_key: vbrm_openvidu_secret_2024_secure_key
      - LIVEKIT_REDIS_ADDRESS=redis:6379
      - LIVEKIT_REDIS_PASSWORD=VbrmRedis2024Secure
    labels:
      - "coolify.managed=true"
      - "traefik.http.services.livekit.loadbalancer.server.port=7880"
      - "traefik.http.routers.livekit.service=livekit"
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - mtb-network

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-VbrmRedis2024Secure}
    volumes:
      - ./data/redis:/data
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - mtb-network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    restart: unless-stopped
    command: server /data --console-address ":9001" --address ":9000"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-vbrm_password_2024}
    volumes:
      - ./data/minio:/data
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - mtb-network

  egress:
    image: livekit/egress:v1.8.6
    restart: unless-stopped
    # Using individual environment variables for Egress instead of a JSON string
    environment:
      - EGRESS_API_KEY=vbrm_openvidu_key
      - EGRESS_API_SECRET=vbrm_openvidu_secret_2024_secure_key
      - EGRESS_WS_URL=ws://livekit:7880
      - EGRESS_REDIS_ADDRESS=redis:6379
      - EGRESS_REDIS_PASSWORD=VbrmRedis2024Secure
      - EGRESS_S3_ACCESS_KEY=IJE1GG708IQ2LEH7I2AS
      - EGRESS_S3_SECRET=PV7b+H48T5k0lSMnkjnu+tYdZTnBzwdiQCEo7mBj
      - EGRESS_S3_REGION=us-east-1
      - EGRESS_S3_ENDPOINT=http://minio:9000
      - EGRESS_S3_BUCKET=bankvision-mtb-ext
      - EGRESS_S3_FORCE_PATH_STYLE=true
    deploy:
      resources:
        limits:
          memory: 1512M
    networks:
      - mtb-network

networks:
  mtb-network:
    external: true
    name: mtb-network
