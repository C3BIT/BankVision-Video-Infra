services:
  livekit:
    image: livekit/livekit-server:v1.8.2
    # Use a unique internal path to avoid any pre-existing Coolify volume conflicts
    command: run --config /livekit_app/config/livekit.yaml
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50010:50000-50010/udp"
    volumes:
      # Mounting the directory is much more reliable in Coolify than mounting individual files
      - ./config:/livekit_app/config:ro
    labels:
      - "coolify.managed=true"
      # Correctly routing the domain to the LiveKit port
      - "traefik.http.services.livekit.loadbalancer.server.port=7880"
      - "traefik.http.routers.livekit.service=livekit"
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - mtb-network

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-VbrmRedis2024Secure}
    volumes:
      - ./data/redis:/data
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - mtb-network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    restart: unless-stopped
    command: server /data --console-address ":9001" --address ":9000"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-vbrm_password_2024}
    volumes:
      - ./data/minio:/data
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - mtb-network

  egress:
    image: livekit/egress:v1.8.6
    restart: unless-stopped
    environment:
      # Use a unique internal path to avoid any pre-existing Coolify volume conflicts
      - EGRESS_CONFIG_FILE=/egress_app/config/egress.yaml
      - LIVEKIT_REDIS_ADDRESS=redis:6379
      - LIVEKIT_REDIS_PASSWORD=VbrmRedis2024Secure
      - LIVEKIT_URL=ws://livekit:7880
    volumes:
      # Mounting the directory is much more reliable in Coolify than mounting individual files
      - ./config:/egress_app/config:ro
    deploy:
      resources:
        limits:
          memory: 1500M
    networks:
      - mtb-network

networks:
  mtb-network:
    external: true
    name: mtb-network
