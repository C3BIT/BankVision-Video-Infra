services:
  livekit:
    image: livekit/livekit-server:v1.8.2
    command: run --config /etc/livekit.yaml
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50020:50000-50020/udp"
    volumes:
      - ./config/livekit.yaml:/etc/livekit.yaml
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - mtb-network

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-VbrmRedis2024Secure}
    volumes:
      - ./data/redis:/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "VbrmRedis2024Secure", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mtb-network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    restart: unless-stopped
    command: server /data --console-address ":9001" --address ":9000"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-vbrm_password_2024}
    volumes:
      - ./data/minio:/data
    deploy:
      resources:
        limits:
          memory: 512M
    # Private storage to avoid conflict with existing server MinIO
    networks:
      - mtb-network

  egress:
    image: livekit/egress:v1.8.6
    restart: unless-stopped
    environment:
      - EGRESS_CONFIG_FILE=/etc/egress.yaml
      - LIVEKIT_REDIS_ADDRESS=redis:6379
      - LIVEKIT_REDIS_PASSWORD=VbrmRedis2024Secure
      - LIVEKIT_URL=ws://livekit:7880
    volumes:
      - ./config/egress.yaml:/etc/egress.yaml
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - mtb-network

#   ingress:
#     image: livekit/ingress:v1.4.3
#     ... (Temporarily disabled for Lean Core stability)

#   prometheus:
#     image: prom/prometheus:v2.54.1
#     ... (Temporarily disabled for Lean Core stability)

#   grafana:
#     image: grafana/grafana:11.2.0
#     ... (Temporarily disabled for Lean Core stability)

networks:
  mtb-network:
    external: true
    name: mtb-network
