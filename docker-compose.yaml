services:
  livekit:
    image: livekit/livekit-server:v1.8.2
    command: run --config /etc/livekit.yaml
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50020:50000-50020/udp"
    volumes:
      - ./config/livekit.yaml:/etc/livekit.yaml
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - mtb-network

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-VbrmRedis2024Secure}
    volumes:
      - ./data/redis:/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "VbrmRedis2024Secure", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mtb-network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    restart: unless-stopped
    command: server /data --console-address ":9001" --address ":9000"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-vbrm_password_2024}
    volumes:
      - ./data/minio:/data
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - mtb-network

  egress:
    image: livekit/egress:v1.8.6
    restart: unless-stopped
    environment:
      - EGRESS_CONFIG_FILE=/etc/egress.yaml
      - LIVEKIT_REDIS_ADDRESS=redis:6379
      - LIVEKIT_REDIS_PASSWORD=VbrmRedis2024Secure
      - LIVEKIT_URL=ws://livekit:7880
    volumes:
      - ./config/egress.yaml:/etc/egress.yaml
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - mtb-network

  ingress:
    image: livekit/ingress:v1.4.3
    restart: unless-stopped
    ports:
      - "1936:1935" # RTMP
      - "7886:7885/udp" # WHIP
    environment:
      - INGRESS_CONFIG_FILE=/etc/ingress.yaml
      - LIVEKIT_REDIS_ADDRESS=redis:6379
      - LIVEKIT_REDIS_PASSWORD=VbrmRedis2024Secure
      - LIVEKIT_URL=ws://livekit:7880
    volumes:
      - ./config/ingress.yaml:/etc/ingress.yaml
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - mtb-network

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.external-url=https://vc.ucchash4vc.xyz/prometheus/
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - mtb-network

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      - GF_SERVER_ROOT_URL=https://vc.ucchash4vc.xyz/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mtb-network

networks:
  mtb-network:
    external: true
    name: mtb-network

volumes:
  prometheus_data:
  grafana_data:
